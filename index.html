        </tbody></table><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" id="tm-add">${ic('plus')}Üye ekle</button><button class="btn sm" id="tm-reset">Varsayılan ekibi yükle</button></div>`;
      $('#tm-add',E).onclick=()=>{ mutate(()=>DB.team.push({id:uid(),name:'Yeni Üye',role:'',group:'',disc:[]})); draw(); };
      $('#tm-reset',E).onclick=async()=>{ if(await confirmBox('Ekip listesi yapılandırmadaki varsayılan ekiple değiştirilsin mi?','Yükle',false)){ mutate(()=>{ DB.team=defaultTeam(); }); draw(); } };
    }
  };
  E.addEventListener('click',e=>{
    const tb=e.target.closest('#db-tabs [data-t]'); if(tb){ cur=tb.dataset.t; open=null; draw(); return; }
    const pr=e.target.closest('tr.pr'); if(pr){ open=open===pr.dataset.n?null:pr.dataset.n; draw(); return; }
    const dr=e.target.closest('.drow[data-key]'); if(dr&&dr.dataset.key){ m.close(); selectFloor(dr.dataset.key,{tab:'tasks',highlight:dr.dataset.id}); if(!dr.dataset.rem) setTimeout(()=>openTaskEditor(dr.dataset.key,dr.dataset.id),350); return; }
    const ch=e.target.closest('.chip[data-d]'); if(ch){ const i=+ch.closest('tr').dataset.i, d=ch.dataset.d; mutate(()=>{ const mb=DB.team[i]; mb.disc=mb.disc||[]; mb.disc=mb.disc.includes(d)?mb.disc.filter(x=>x!==d):[...mb.disc,d]; }); draw(); return; }
    const del=e.target.closest('[data-del]'); if(del){ const i=+del.closest('tr').dataset.i; mutate(()=>DB.team.splice(i,1)); draw(); return; }
  });
  E.addEventListener('change',e=>{ const f=e.target.dataset.f; const tr=e.target.closest('tr[data-i]'); if(f&&tr){ const i=+tr.dataset.i, v=e.target.value.trim(); const old=DB.team[i][f];
    mutate(()=>{ DB.team[i][f]=v; if(f==='name'&&old&&v) for(const {t} of allTasks()) if(t.assignee===old) t.assignee=v; }); } });
  draw();
}

/* ==========================================================================
   KLAVYE KISAYOLLARI
   ========================================================================== */
addEventListener('keydown',e=>{
  const tg=e.target, tag=(tg.tagName||'').toLowerCase(); const typing=tag==='input'||tag==='textarea'||tag==='select'||tg.isContentEditable;
  const k=e.key;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
  if(k==='Escape'){ if(ddEl){ closeDD(); return; } if(bubbleTarget&&!modalStack.length){ closeBubble(); return; } if(modalStack.length){ modalStack[modalStack.length-1].close(); return; } if(typing){ tg.blur(); return; } if(selected){ deselect(); return; } return; }
  if(typing||modalStack.length) return;
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  switch(k){
    case '1': setTimeMode('day'); break; case '2': setTimeMode('noon'); break; case '3': setTimeMode('evening'); break; case '4': setTimeMode('night'); break;
    case 'q': case 'Q': setStyle('normal'); break; case 'w': case 'W': setStyle('blender'); break; case 'e': case 'E': setStyle('cyber'); break;
    case 'n': case 'N': setViewMode('normal'); break; case 'x': case 'X': setViewMode(DB.view.viewMode==='xray'?'normal':'xray'); break; case 'h': case 'H': setViewMode(DB.view.viewMode==='heat'?'normal':'heat'); break;
    case 'f': case 'F': focusSelected(); break; case 'r': case 'R': deselect(); flyToView('general'); break;
    case 'd': case 'D': openDashboard(); break; case 't': case 'T': openReminders(); break;
    case 'ArrowUp': if(selected){ e.preventDefault(); stepFloor(1); } break; case 'ArrowDown': if(selected){ e.preventDefault(); stepFloor(-1); } break;
    case '?': openHelp(); break;
    case 'y': case 'Y': { const W=['clear','rain','snow','fog','storm']; setWeather(W[(W.indexOf(DB.view.weather||'clear')+1)%W.length]); break; }
  }
});

function init(){
  initTopbar(); initViews(); initSummary();
  if(firstRun){ persist(true); setTimeout(()=>toast('Hoş geldiniz · Bir kata tıklayıp “Yeni görev” ile başlayın','info',5200),1200); }
  statsCache.clear();
  applyQuality(); updateFloorVisuals(); updateIndicators(); renderSummary(); refreshTopbar();
  applyTimeOfDay(timeState.hour); updateEnv();
  if(!DB.view.camera) setActiveView('general');
  if(DB.settings.sound){ const once=()=>{ audioEnable(true); removeEventListener('pointerdown',once); }; addEventListener('pointerdown',once); }
  requestAnimationFrame(frame);
}
try{ init(); }catch(err){ console.error(err); document.getElementById('loader-msg').innerHTML='<div class="err">Başlatma hatası: '+esc(err.message)+'</div>'; }
